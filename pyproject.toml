[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "patchhound"
version = "0.1.0"
description = "PatchHound - BloodHound credential import & ownership tagging tool"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "A3-N" }]

dependencies = [
  "requests>=2.32.0",
  "neo4j>=5.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8"]

[project.scripts]
patchhound = "patchhound.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["patchhound"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[project.urls]
Homepage = "https://github.com/A3-N/PatchHound"
Issues = "https://github.com/A3-N/PatchHound/issues"
